<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion · DAP ONCF EMIZ</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
  <div class="bg-liquid"><span class="blob blob-1"></span><span class="blob blob-2"></span><span class="blob blob-3"></span></div>
  <div class="login-wrap">
    <div class="login-card glass">
      <div class="login-logo">
        <img src="{{ ONCF_LOGO_URL }}" alt="ONCF"
             onerror="this.outerHTML='<span class=\'login-fallback\'>O</span>'">
        <h1>DAP — ONCF</h1>
        <p>Demande d'Approvisionnement Pièces · Atelier EMIZ</p>
      </div>

      {% if error %}
        <div class="form-error"><i data-lucide="alert-circle"></i>{{ error }}</div>
      {% endif %}

      <form method="post" action="/login">
        <div class="field">
          <label>Adresse email</label>
          <input type="email" name="email" placeholder="votre.email@oncf.ma" required>
        </div>
        <div class="field">
          <label>Mot de passe</label>
          <input type="password" name="password" placeholder="••••••••" required>
        </div>
        <button class="btn btn-primary btn-block" type="submit">
          <i data-lucide="log-in"></i> Se connecter
        </button>
      </form>

      {% if demo_accounts %}
      <div class="demo-accounts">
        <div class="demo-title">Connexion rapide démo (mot de passe : <strong>{{ demo_password }}</strong>)</div>
        <div class="demo-grid">
          {% for acc in demo_accounts %}
            <form method="post" action="/login">
              <input type="hidden" name="email" value="{{ acc.email }}">
              <input type="hidden" name="password" value="{{ demo_password }}">
              <button class="demo-btn" type="submit">
                {{ acc.label }}<small>{{ acc.name }}</small>
              </button>
            </form>
          {% endfor %}
        </div>
      </div>
      {% endif %}
    </div>
  </div>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script>if (window.lucide) lucide.createIcons();</script>
</body>
</html>
